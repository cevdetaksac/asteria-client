[package]
name = "asteria-encode"
version = "0.1.0"
edition = "2021"
license = "LicenseRef-Asteria-Proprietary"

[dependencies]
serde_json = "1"   # MIT OR Apache-2.0
str0m = { version = "0.24", default-features = false, features = ["wincrypto"] }  # MIT OR Apache-2.0


[dependencies.windows]   # MIT OR Apache-2.0
version = "0.58"
features = ["Win32_Foundation","Win32_Graphics_Dxgi","Win32_Graphics_Dxgi_Common","Win32_Graphics_Direct3D","Win32_Graphics_Gdi","Win32_Graphics_Direct3D11","Win32_Media_MediaFoundation","Win32_System_Com","Win32_System_RemoteDesktop","Win32_System_Variant","Win32_System_Threading","Win32_Security","Win32_System_StationsAndDesktops","Win32_UI_WindowsAndMessaging","Win32_UI_Input_KeyboardAndMouse","Win32_System_Shutdown","Win32_System_Pipes","Win32_Storage_FileSystem","Win32_System_IO","Win32_System_DataExchange","Win32_System_Memory","Win32_UI_HiDpi","Win32_System_LibraryLoader","Win32_Graphics_Gdi"]

[profile.release]
opt-level = 3
lto = true
strip = true
panic = "abort"
