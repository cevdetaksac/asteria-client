[package]
name = "asteria-encode"
version = "0.1.0"
edition = "2021"
license = "LicenseRef-Asteria-Proprietary"

[dependencies]
serde_json = "1"   # MIT OR Apache-2.0

[dependencies.windows]   # MIT OR Apache-2.0
version = "0.58"
features = ["Win32_Foundation","Win32_Graphics_Dxgi","Win32_Graphics_Dxgi_Common","Win32_Graphics_Direct3D","Win32_Graphics_Gdi","Win32_Graphics_Direct3D11","Win32_Media_MediaFoundation","Win32_System_Com","Win32_System_RemoteDesktop"]

[profile.release]
opt-level = 3
lto = true
strip = true
panic = "abort"
